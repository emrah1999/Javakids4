<html>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<head>

</head>

<body>
    <div class="row" style="margin-top: 10px;">
        <div class="col-md-2">
            <input id="username" class="form-control" placeholder="Username">
        </div>
        <div class="col-md-2">
            <input id="password" class="form-control" placeholder="Şifrə" type="password">
        </div>
        <div class="col-md-2">
            <button onclick="loginButton()" class="btn btn-success">Login</button>
            <button onclick="logout()" class="btn btn-danger">Logout</button>
        </div>
    </div>



    <br>
    <button style="margin-top:30px" class="btn btn-primary" onclick="books()">Kitablari getir</button>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Id</th>
                <th>Barcode</th>
                <th>Title</th>
                <th>Author</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody id="table-bookds-body"></tbody>

    </table>
</body>

<script>
    function logout() {
        TokenService.clear();
        alert("Cixish etdiniz")
    }
    const TokenService = {
        getAccessToken() {
            return localStorage.getItem("accessToken");
        },
        getRefreshToken() {
            return localStorage.getItem("refreshToken");
        },
        setTokens(accessToken, refreshToken) {
            localStorage.setItem("accessToken", accessToken);
            localStorage.setItem("refreshToken", refreshToken);
        },
        clear() {
            localStorage.clear();
        }
    };

    function login(username, password) {
        return fetch("http://localhost:8080/api/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({username, password})
        })
            .then(res => {
                if (!res.ok) throw new Error("Login failed");
                return res.json();
            })
            .then(data => {

                TokenService.setTokens(data.jwt, data.refreshToken);

                alert("Login ugurlu oldu")
                return data;
            });
    }

    function loginButton() {

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        login(username, password)

            .catch(err => console.error(err));


    }
    function refreshToken() {
        if (!TokenService.getRefreshToken()) {
            alert("Login ol");
            return;
        }
        return fetch("http://localhost:8080/api/auth/refresh-token", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                refreshToken: TokenService.getRefreshToken()
            })
        })
            .then(res => {
                alert("Yeniden login ol")
                if (!res.ok) throw new Error("Refresh token expired");
                return res.json();
            })
            .then(data => {
                TokenService.setTokens(data.jwt, data.refreshToken);
                return data.accessToken;
            });
    }

    function books() {
        // var search = document.getElementById('search').value;

        return authFetch("http://localhost:8080/api/books?size=10&page=0", {
            method: "GET"
        })
            .then(res => res.json())
            .then(data => {
                let tbody = document.getElementById('table-bookds-body');
                tbody.innerHTML = '';
                var books = data.books
                books.forEach((value, index) => {
                    tbody.innerHTML += `
                <tr>
                    <td>${value.id}</td>
                    <td>${value.barcode}</td>
                    <td>${value.name}</td>
                    <td>${value.author}</td>
                    <td>${value.price}</td>
                </tr>
            `;
                });
            })
            .then(data => console.log(data));
    }

    //butun apiler ucun hazir funksiya/ 
    function authFetch(url, options = {}) {
        const accessToken = TokenService.getAccessToken();

        options.headers = {
            ...options.headers,
            "Authorization": "Bearer " + accessToken
        };

        return fetch(url, options)
            .then(res => {
                if (res.status === 401) {
                    // JWT bitib → refresh et
                    return refreshToken()
                        .then(newAccessToken => {
                            options.headers["Authorization"] = "Bearer " + newAccessToken;
                            return fetch(url, options); // retry
                        });
                }

                if (res.status === 403) {
                    alert("Bu əməliyyat üçün icazən yoxdur!");
                    TokenService.clear();
                    throw new Error("Forbidden");
                }

                if (res.status === 500) {
                    alert("Server xətası baş verdi");
                    throw new Error("Server error");
                }

                return res;
            });
    }

</script>

</html>
